spring:
  application:
    name: habitquest

  datasource:
    # Values come from environment variables in production; defaults match docker-compose.yml for local dev.
    # On Heroku, the Java buildpack sets JDBC_DATABASE_* from the Postgres add-on.
    url: ${DB_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/habitquest}}
    username: ${DB_USERNAME:${JDBC_DATABASE_USERNAME:habitquest}}
    password: ${DB_PASSWORD:${JDBC_DATABASE_PASSWORD:habitquest}}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match the tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Heroku tells the app which port to listen on via PORT.
  port: ${PORT:8080}

app:
  jwt:
    # HS256 signing key, at least 32 characters. The default is for local dev only; set JWT_SECRET in production.
    secret: ${JWT_SECRET:local-dev-secret-change-me-in-production-0123456789}
    expiration: ${JWT_EXPIRATION:7d}

management:
  endpoints:
    web:
      exposure:
        include: health
