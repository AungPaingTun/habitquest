services:
  postgres:
    image: postgres:16
    container_name: habitquest-db
    environment:
      POSTGRES_DB: habitquest
      POSTGRES_USER: habitquest
      POSTGRES_PASSWORD: habitquest
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitquest -d habitquest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
